<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="AI MUSIC STUDIO - Suno·뮤직비디오 제작 프롬프트를 9단계로 생성하고 복사하는 워크플로"><title>AI MUSIC STUDIO | 9단계 제작 흐름</title>
<style>
:root{color-scheme:dark;--bg:#0b0e15;--card:#181d27;--border:#394154;--purple:#aa99ff;--text:#f6f7fc;--muted:#a8b1c3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,"Noto Sans KR",sans-serif}main{max-width:1180px;margin:auto;padding:24px 16px 70px}header{margin-bottom:22px}h1{margin:0;font-size:clamp(26px,5vw,38px)}header p,.hint,small{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(260px,350px) 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:20px;margin-bottom:16px}h2{font-size:19px;margin:0 0 12px}label{display:block;margin:10px 0 5px;font-size:13px;color:#d5d9e7;font-weight:650}input,select,textarea{background:#0c111a;border:1px solid #485066;border-radius:10px;color:var(--text);padding:12px;width:100%;font:inherit}textarea{resize:vertical;min-height:145px}.prompt{min-height:350px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.steps{display:grid;gap:8px}.step{display:flex;gap:10px;width:100%;text-align:left;background:#101621;border:1px solid var(--border);color:#e9eaf5;border-radius:10px;padding:13px 11px;font:inherit;cursor:pointer}.step.active{background:#302a4a;border-color:var(--purple)}.num{background:#343b50;width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:50%;font-weight:700}.step.done .num{background:#26604c}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}button{cursor:pointer}button.action{background:#30384a;border:1px solid #59617c;border-radius:10px;color:white;padding:11px 13px;font-weight:700}button.primary{background:var(--purple);color:#161220;border-color:transparent}button:disabled{opacity:.4;cursor:default}.hint{margin:0 0 14px}.status{color:#8ee2bc;font-size:13px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.footer{color:var(--muted);font-size:12px}@media(max-width:750px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.card{padding:15px}.prompt{min-height:310px}}
</style></head><body><main><header><h1>AI MUSIC STUDIO <span style="color:var(--purple)">v0.7</span></h1><p>작업 순서 → 프롬프트 복사 → ChatGPT / Suno / Grok 작업 → 결과 저장 → 다음 단계</p></header>
<section class="card"><h2>프로젝트 설정</h2><div class="grid">
<div><label for="song">곡 제목</label><input id="song" placeholder="미정이면 비워두세요"></div>
<div><label for="channel">채널</label><select id="channel"><option>한국어 채널</option><option>夏のあとで (일본어 채널)</option></select></div>
<div><label for="genre">로파이 세부 장르</label><select id="genre"><option>Dreamy Lo-fi Pop</option><option>Acoustic Lo-fi</option><option>Bedroom Pop</option><option>Jazz Lo-fi</option><option>City Pop Lo-fi</option><option>Indie Folk</option><option>Ambient Lo-fi</option><option>Chillhop</option></select></div>
<div><label for="bpm">BPM</label><input id="bpm" type="number" value="74" min="40" max="220"></div>
<div><label for="theme">주제</label><input id="theme" placeholder="전하지 못한 마음"></div><div><label for="mood">감정</label><input id="mood" placeholder="몽환적 위로"></div>
<div><label for="vocal">보컬</label><input id="vocal" value="soft intimate female vocal"></div><div><label for="instruments">악기</label><input id="instruments" value="acoustic guitar, mellow piano"></div></div>
<label for="notes">공통 연출 규칙 및 이전 곡과의 차별화</label><textarea id="notes" style="min-height:75px">캐릭터 일관성 유지, 16:9 고해상도, 이미지에 텍스트 없음, 과도한 카메라 이동 금지</textarea>
<div class="buttons"><button class="action" id="export">결과 JSON 백업</button><button class="action" id="import">백업 불러오기</button><input id="file" type="file" accept="application/json" hidden></div></section>
<div class="layout"><aside class="card"><h2>전체 제작 흐름</h2><nav class="steps" id="steps"></nav></aside>
<section class="card"><div class="top"><h2 id="title"></h2><span class="status" id="status"></span></div><p class="hint" id="description"></p>
<label for="prompt">ChatGPT에 넣을 프롬프트</label><textarea class="prompt" id="prompt" spellcheck="false"></textarea>
<div class="buttons"><button class="action primary" id="copy">프롬프트 복사</button><button class="action" id="reset">프롬프트 다시 생성</button><button class="action" id="chat">ChatGPT 열기</button></div>
<label for="result">이 단계의 결과 저장 (답변을 붙여넣으면 다음 프롬프트에 반영)</label><textarea id="result" placeholder="ChatGPT에서 받은 결과 또는 작업 기록을 붙여넣으세요"></textarea>
<div class="buttons"><button class="action" id="copyResult">결과 복사</button><button class="action" id="prev">← 이전</button><button class="action primary" id="next">다음 단계 →</button></div>
<p class="footer">API 없이 브라우저에만 저장됩니다. 다른 기기에서는 자동 동기화되지 않습니다. 음원 분석은 오디오 파일을 ChatGPT 대화에 직접 첨부해야 합니다.</p></section></div></main>
<script>
const stages=[["신곡 기획","새로운 제목·콘셉트·후렴·구조를 기획한다.","음악 기획자로서 신곡 제목 후보 5개, 최종 추천, 스토리, 후렴 문구 3개, 구간 구조, 차별화 포인트를 작성해. 기존 곡과 제목·후렴·정서의 중복을 피하고 한 곡에 집중해."],["Suno 가사·스타일 프롬프트","Suno용 가사와 스타일을 분리한다.","최종 곡의 독창적 가사를 [Intro][Verse 1][Chorus][Verse 2][Chorus][Bridge][Final Chorus][Outro] 구조로 작성해. Suno 가사만 담은 복사 블록, 짧은 영어 Style 블록, Exclude 블록을 각각 분리해. 일본어 곡이라면 발음·한국어 해석은 Suno 입력용 가사와 별도 제공해."],["Suno 음원 생성 및 선택","후보곡을 만들고 최종 파일을 고른다.","Suno 후보 A/B를 비교할 수 있게 보컬 자연스러움, 후렴 전달력, 편곡, 마무리, 장르 적합도에 따른 5점 평가표와 선택 체크리스트를 작성해. 실제 음원 파일을 받지 않았다면 들었다고 주장하지 마. 확정 파일명과 정확한 길이는 사용자가 기록하도록 해."],["완성 음원 분석","실제 음원에서 구간과 타임코드를 확인한다.","첨부한 최종 오디오를 실제로 확인해 총 길이와 인트로·벌스·후렴·브리지·아웃트로의 시작·끝 타임코드를 정리해. 보컬 변화, 악기·감정의 변곡점과 컷 편집 지점을 구분해. 오디오가 첨부되지 않았거나 확인할 수 없으면 시간을 만들어내지 말고 정확히 어떤 자료가 필요한지 말해."],["뮤직비디오 장면 설계","실제 음원 길이에 맞는 스토리보드를 만든다.","실제 음원 분석값을 기반으로 장면 번호, 시작·종료 초, 감정, 가사·연출, 배경, 카메라, 이미지 핵심 요소를 표로 설계해. 장면별 길이의 합계가 음원 총 길이와 일치하는지 검산해. 분석에 실제 타임코드가 없으면 임의의 수치를 만들지 마."],["장면별 이미지 제작","장면마다 독립된 시작 이미지 프롬프트를 만든다.","주인공 캐릭터 시트를 먼저 정하고, 스토리보드 각 장면에 맞는 16:9 고해상도 이미지 프롬프트를 장면별로 개별 복사 가능하게 작성해. 얼굴·의상·소품·작화·색감의 연속성을 유지하고 이미지에 글자·자막·로고를 넣지 마. 한 번에 콜라주를 만들지 마."],["장면별 영상 프롬프트","이미지에 일치하는 움직임을 설계한다.","각 장면의 시작 이미지와 스토리보드를 기준으로 Grok Imagine 이미지→영상 영어 모션 프롬프트를 개별 작성해. 의미 있는 움직임 1~2개와 절제된 카메라 워크만 사용하고 얼굴·의상·배경 변형과 불필요한 등장 요소를 막아. 생성 가능 초수는 서비스에서 확인하고 실제 편집 구간과 구분해."],["영상 편집·싱크 검수","전체 영상과 음악을 정밀하게 맞춘다.","장면별 영상 클립을 원곡 타임라인에 맞게 순서대로 편집하는 FFmpeg 또는 CapCut 작업표를 작성해. 전체 러닝타임·음악 싱크·화면 비율·화질·끊김·전환·캐릭터 일관성을 점검해. 실제 편집 파일이 없으면 렌더링이나 검수가 완료됐다고 말하지 마."],["유튜브 업로드 패키지","제목·설명·썸네일·태그·고정댓글을 준비한다.","채널 언어에 맞는 SEO 친화적 제목 후보 5개 및 최종 추천, 설명란, 해시태그, 쉼표 구분 검색 태그, 글자 없는 16:9 썸네일 프롬프트, 고정댓글, 카테고리와 AI 합성 콘텐츠 공개 여부 확인 항목을 제안해. 확인되지 않은 정보나 업로드 완료 사실은 만들지 마."]];
const ids=['song','channel','genre','bpm','theme','mood','vocal','instruments','notes'];
const $=id=>document.getElementById(id);
let state={step:0,fields:{},results:Array(stages.length).fill(''),edits:{}};
try{let v=JSON.parse(localStorage.getItem('ai-music-studio-v07'));if(v&&typeof v==='object')state={...state,...v};}catch(e){}
function save(){try{localStorage.setItem('ai-music-studio-v07',JSON.stringify(state));}catch(e){$('status').textContent='저장 공간 부족';}}
ids.forEach(id=>{if(state.fields[id]!==undefined)$(id).value=state.fields[id];$(id).addEventListener('input',()=>{state.fields[id]=$(id).value;save();if(!Object.hasOwn(state.edits,state.step))$('prompt').value=generate();});});
function generate(){let f=Object.fromEntries(ids.map(id=>[id,$(id).value]));let pre='[AI MUSIC STUDIO | '+(state.step+1)+'단계: '+stages[state.step][0]+']\n곡 제목: '+(f.song||'추천 필요')+'\n채널: '+f.channel+'\n장르: '+f.genre+'\nBPM: '+f.bpm+'\n주제: '+(f.theme||'기획 필요')+'\n감정: '+(f.mood||'기획 필요')+'\n보컬: '+f.vocal+'\n악기: '+f.instruments+'\n공통 규칙: '+f.notes+'\n\n';
let history=state.results.map((s,i)=>i<state.step&&s?'[이전 '+(i+1)+'단계 결과]\n'+s.slice(0,16000):'').filter(Boolean).join('\n\n');
return pre+stages[state.step][2]+(history?'\n\n'+history:'');}
function render(){let area=$('steps');area.replaceChildren();stages.forEach((s,i)=>{let b=document.createElement('button');b.className='step'+(i===state.step?' active':'')+(state.results[i]?' done':'');let n=document.createElement('span');n.className='num';n.textContent=state.results[i]?'✓':String(i+1);let label=document.createElement('span');label.textContent=s[0];b.append(n,label);b.onclick=()=>move(i);area.append(b)});$('title').textContent=(state.step+1)+'. '+stages[state.step][0];$('description').textContent=stages[state.step][1];$('status').textContent=state.results[state.step]?'✓ 저장됨':'진행 중';$('prompt').value=state.edits[state.step]??generate();$('result').value=state.results[state.step]||'';$('prev').disabled=state.step===0;$('next').textContent=state.step===stages.length-1?'첫 단계로 ↺':'다음 단계 →';}
function move(i){state.edits[state.step]=$('prompt').value;state.results[state.step]=$('result').value;state.step=i;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function copy(v){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(()=>$('status').textContent='복사 완료').catch(()=>fallback(v));}else fallback(v)}
function fallback(v){let t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();$('status').textContent='복사 완료';}
$('copy').onclick=()=>copy($('prompt').value);$('copyResult').onclick=()=>copy($('result').value);$('chat').onclick=()=>window.open('https://chatgpt.com/','_blank','noopener,noreferrer');$('reset').onclick=()=>{delete state.edits[state.step];$('prompt').value=generate();save();};$('prompt').oninput=()=>{state.edits[state.step]=$('prompt').value;save();};$('result').oninput=()=>{state.results[state.step]=$('result').value;save();renderStepsOnly();};function renderStepsOnly(){let keep=$('prompt').value;let res=$('result').value;render();$('prompt').value=keep;$('result').value=res;}
$('prev').onclick=()=>move(Math.max(0,state.step-1));$('next').onclick=()=>move((state.step+1)%stages.length);
$('export').onclick=()=>{let a=document.createElement('a');let u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=u;a.download='ai-music-studio-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v.results)||!confirm('현재 작업 내용을 백업 파일로 교체할까요?'))return;state=v;ids.forEach(id=>{$(id).value=state.fields?.[id]??$(id).value});save();render();}catch(e){alert('백업 파일 형식을 확인해 주세요.')}};
render();
</script></body></html>
