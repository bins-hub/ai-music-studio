<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Music Studio | Personal Workspace</title><style>
:root{font-family:Inter,system-ui,'Noto Sans KR',sans-serif;color:#e8edf8;background:#0b1020}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{padding:28px 18px;border-right:1px solid #273047;background:#111827;position:sticky;top:0;height:100vh}.brand{font-size:19px;font-weight:800;letter-spacing:.03em;margin-bottom:5px}.brand span{color:#8d9eff}.small{font-size:12px;color:#96a4be}.nav{margin-top:35px;display:grid;gap:8px}.nav button{color:#aebbd2;background:transparent;text-align:left;border:0;padding:13px 14px;border-radius:10px;font-size:14px;cursor:pointer}.nav button.active,.nav button:hover{background:#273454;color:white}.nav button span{margin-right:10px}.main{padding:32px clamp(16px,4vw,55px);max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:27px}.top h1{font-size:27px;letter-spacing:-.04em;margin:0 0 5px}.pill{background:#22304e;color:#aec1ff;padding:6px 10px;border-radius:99px;font-size:12px}.panel{background:#151e30;border:1px solid #2a3852;border-radius:16px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.metric strong{display:block;font-size:30px;margin-top:12px}.metric{padding:18px}.muted{color:#9aabc5}.btn{border:1px solid #394762;background:#25324b;color:#eaf1fe;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:650}.btn.primary{background:#7479ef;border-color:#7479ef;color:white}.btn.good{background:#18584b;border-color:#23735d}.btn:hover{filter:brightness(1.15)}.btn:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:9px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:12px}.song{background:#172238;border:1px solid #2c3b55;border-radius:12px;padding:18px;cursor:pointer}.song:hover{border-color:#858ff7}.song h3{margin:12px 0 7px}.tag{font-size:11px;color:#aab9d5;background:#293652;border-radius:20px;padding:5px 8px}input,select,textarea{width:100%;background:#0e1728;color:#eaf0fa;border:1px solid #36435b;padding:12px 13px;border-radius:9px;font:inherit}textarea{min-height:110px;resize:vertical}label{display:block;font-size:12px;color:#b9c9e2;margin-bottom:7px}.field{margin-bottom:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.steps{display:flex;gap:5px;margin:20px 0;flex-wrap:wrap}.step{flex:1;min-width:80px;text-align:center;font-size:11px;color:#899ab5}.step .bar{height:6px;background:#30405b;border-radius:9px;margin-bottom:8px}.step.done .bar{background:#55bfa1}.step.current .bar{background:#8991fa}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.sectionTitle{font-weight:750;font-size:17px;margin:0 0 17px}.hidden{display:none!important}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:17px 0}.tabs button{padding:10px 12px;background:#1b2941;border:1px solid #30415d;color:#b9c5db;border-radius:10px;cursor:pointer}.tabs button.on{background:#323e70;color:white;border-color:#7785df}.status{padding:9px 12px;border:1px solid #4b5e7b;border-radius:9px;color:#cbd6ea;font-size:13px}.scene{border:1px solid #30405d;padding:17px;border-radius:12px;margin:12px 0;background:#18233a}.help{font-size:12px;line-height:1.8;color:#9aabc5}.danger{color:#ffadad}.large{font-size:23px;font-weight:750}.link{color:#a6b3ff;text-decoration:none}.inline{display:flex;gap:9px;align-items:center}.inline>*{flex:1}.inline .btn{flex:0 0 auto}footer{font-size:12px;color:#7788a7;margin:25px 0}.empty{border:1px dashed #41516e;border-radius:12px;padding:30px;text-align:center;color:#a7b9d1}.mobileHead{display:none}@media(max-width:850px){.app{display:block}.sidebar{height:auto;position:relative;padding:16px}.brand{font-size:16px}.nav{margin-top:15px;display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.main{padding:20px 13px}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.top h1{font-size:23px}.panel{padding:16px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">◈ AI <span>MUSIC STUDIO</span></div><div class="small">PERSONAL PRODUCTION • MVP 0.4</div><div class="nav" id="nav"><button class="active" data-view="dashboard"><span>◫</span>대시보드</button><button data-view="songs"><span>♫</span>곡 라이브러리</button><button data-view="workspace"><span>▶</span>제작 워크스페이스</button><button data-view="settings"><span>⚙</span>백업 / 설정</button></div><div class="help" style="margin-top:35px">Suno → ChatGPT → Grok → CapCut<br>API 없이 ChatGPT 채팅과 복사·붙여넣기로 제작합니다. 제작 기록은 이 기기에 저장됩니다.</div></aside><main class="main"><header class="top"><div><h1 id="pageTitle">제작 대시보드</h1><div class="muted small">아이디어부터 유튜브 출시까지, 한 곡씩 완성하는 작업실</div></div><span class="pill" id="currentBadge">LOCAL • NO API</span></header><div id="content"></div><footer>AI Music Studio MVP 0.4 · 이 브라우저의 로컬 저장소 사용 · 백업 파일을 주기적으로 내려받으세요.</footer></main></div>
<script>
const KEY='ai_music_studio_mvp_v1';const stages=['기획','Suno 패키지','음원 선정','음원 분석','Grok 제작','CapCut 편집','출시 검수','완료'];const genres=['Acoustic Lo-fi','Bedroom Pop','Dreamy Lo-fi Pop','Jazz Lo-fi','R&B Lo-fi','City Pop Lo-fi','Folk Lo-fi','Piano Lo-fi','Chillhop'];const specs={'Acoustic Lo-fi':'warm fingerpicked acoustic guitar, intimate soft female vocals, mellow piano, understated dusty drums, gentle bass, cozy tape texture','Bedroom Pop':'soft close-mic female vocals, intimate guitar, understated groove, gentle bass, organic bedroom recording texture','Dreamy Lo-fi Pop':'airy female vocals, dreamy analog pads, shimmering clean guitar, soft lo-fi drums, floating melodies','Jazz Lo-fi':'warm Rhodes piano, brushed drums, gentle jazzy chord extensions, warm bass, intimate soft female vocals','R&B Lo-fi':'soft female vocals, laid-back neo-soul rhythm, mellow bass, lush electric piano, gentle percussion','City Pop Lo-fi':'subtle city pop groove, clean electric guitar, retro electric piano, mellow synths, smooth bass, intimate female vocals','Folk Lo-fi':'storytelling female vocals, fingerstyle folk guitar, organic soft percussion, warm tape saturation','Piano Lo-fi':'delicate female vocals, intimate felt piano, warm tape hiss, sparse gentle beats, wistful melodies','Chillhop':'jazz-influenced mellow keys, relaxed hip-hop drums, soft warm bass, intimate female singing'};
let db=load(),view='dashboard',activeId=db.active||null,subtab='suno';function load(){try{return JSON.parse(localStorage.getItem(KEY))||{songs:[],active:null}}catch(e){return {songs:[],active:null}}}function save(){db.active=activeId;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('로컬 저장 공간이 부족합니다. JSON 백업 후 파일 링크 중심으로 관리하세요.')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function id(){return 'M'+Date.now().toString(36).toUpperCase()}function song(){return db.songs.find(x=>x.id===activeId)}function title(){return {dashboard:'제작 대시보드',songs:'곡 라이브러리',workspace:'제작 워크스페이스',settings:'백업 / 설정'}[view]}function go(v){view=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));
function field(k,label,value,type='text',extra=''){return `<div class="field"><label>${label}</label>${type==='textarea'?`<textarea data-field="${k}" ${extra}>${esc(value)}</textarea>`:type==='select'?`<select data-field="${k}">${extra}</select>`:`<input data-field="${k}" type="${type}" value="${esc(value)}" ${extra}>`}</div>`}function metric(label,val){return `<div class="panel metric"><div class="muted small">${label}</div><strong>${val}</strong></div>`}
function render(){document.getElementById('pageTitle').textContent=title();document.getElementById('currentBadge').textContent=song()?song().id+' · '+song().stage:'LOCAL • NO API';let h='';if(view==='dashboard'){let total=db.songs.length;h=`<div class="grid">${metric('등록된 곡',total)}${metric('진행 중',db.songs.filter(x=>x.stage!=='완료').length)}${metric('완료',db.songs.filter(x=>x.stage==='완료').length)}</div><div class="panel"><div class="row"><h2 class="sectionTitle">빠른 시작</h2><button class="btn primary" id="newSong">＋ 신곡 실행</button></div><p class="muted">신곡을 시작하면 장르·가사·Suno 스타일을 기획하고 다음 단계로 이동할 수 있습니다.</p><div class="actions"><button class="btn" data-go="workspace">현재 작업 이어가기</button><button class="btn" data-go="songs">곡 라이브러리</button></div></div><div class="panel"><h2 class="sectionTitle">최근 프로젝트</h2>${songsHtml(db.songs.slice().reverse().slice(0,6))}</div>`}if(view==='songs')h=`<div class="panel"><div class="row"><h2 class="sectionTitle">내 음악 라이브러리</h2><button class="btn primary" id="newSong">＋ 신곡</button></div>${songsHtml(db.songs.slice().reverse())}</div>`;if(view==='workspace')h=workspace();if(view==='settings')h=`<div class="panel"><h2 class="sectionTitle">데이터 백업·복원</h2><p class="help">MVP는 서버 없이 이 브라우저에 기록됩니다. 브라우저 데이터 삭제나 기기 변경 시 데이터가 사라질 수 있으니 JSON 백업을 보관하세요. 음원과 영상은 파일 자체가 아닌 URL을 저장합니다.</p><div class="actions"><button class="btn primary" id="export">JSON 백업 다운로드</button><label class="btn" style="cursor:pointer;color:#eaf1fe;margin:0">JSON 가져오기<input type="file" accept="application/json,.json" id="import" style="display:none"></label></div></div><div class="panel"><h2 class="sectionTitle">연결 상태</h2><div class="status">Google Sheets: 수동 링크 / 자동 동기화 미연결</div><p><a class="link" target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/14xoWAndklD9_TzhnPQflAV6LdB6VsseYBlWvXiPIxX8/edit">기존 AI Music Studio Google Sheets 열기 ↗</a></p><div class="status">OpenAI API: 로컬 서버 설정 필요 · Suno/Grok/CapCut 직접 API 연동 없음 · 클라우드 동기화 미연결</div></div>`;document.getElementById('content').innerHTML=h;bind();}
function songsHtml(xs){return xs.length?`<div class="cards">${xs.map(x=>`<div class="song" data-open="${esc(x.id)}"><span class="tag">${esc(x.channel)}</span> <span class="tag">${esc(x.stage)}</span><h3>${esc(x.title||'제목 미정')}</h3><div class="small muted">${esc(x.genre)} · ${esc(x.id)}</div></div>`).join('')}</div>`:`<div class="empty">아직 곡이 없습니다. '신곡 실행'으로 첫 곡을 만들어보세요.</div>`}
function workspace(){let s=song();if(!s)return `<div class="panel"><div class="empty">선택된 곡이 없습니다.<p><button class="btn primary" id="newSong">신곡 실행</button></p></div></div>`;return `<div class="panel"><div class="row"><div><div class="small muted">${esc(s.id)} · ${esc(s.channel)}</div><div class="large">${esc(s.title||'제목 미정')}</div></div><button class="btn" id="saveNow">저장</button></div><div class="steps">${stages.map((x,i)=>`<div class="step ${i<stages.indexOf(s.stage)?'done':i===stages.indexOf(s.stage)?'current':''}"><div class="bar"></div>${esc(x)}</div>`).join('')}</div><div class="actions"><button class="btn good" data-studio-command="신곡 실행">실행문 복사</button><button class="btn" data-studio-command="다음">다음 작업문 복사</button><button class="btn" data-studio-command="검수">검수문 복사</button><button class="btn" data-studio-command="편집">편집 의뢰문 복사</button></div><p class="help">버튼을 누르면 ChatGPT에 붙여 넣을 명령어가 복사됩니다. 웹앱이 ChatGPT를 직접 제어하지는 않습니다.</p><div class="actions"><button class="btn" id="prev">← 이전 단계</button><button class="btn primary" id="next">다음 단계 →</button><button class="btn" id="review">현재 단계 검수</button></div></div><div class="tabs">${[['suno','① Suno 기획'],['audio','② 음원 분석'],['grok','③ Grok 제작'],['capcut','④ CapCut 편집'],['release','⑤ 출시 검수']].map(([k,t])=>`<button data-tab="${k}" class="${subtab===k?'on':''}">${t}</button>`).join('')}</div>${subtab==='suno'?suno(s):subtab==='audio'?audio(s):subtab==='grok'?grok(s):subtab==='capcut'?capcut(s):release(s)}`}
function opts(items,current){return items.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('')}
function suno(s){return `<div class="panel"><h2 class="sectionTitle">음악 기술서 · 신곡 기획</h2><div class="two">${field('title','곡 제목',s.title)}${field('channel','채널',s.channel,'select',opts(['한국어 채널','夏のあとで'],s.channel))}${field('genre','세부 로파이 장르',s.genre,'select',opts(genres,s.genre))}${field('bpm','목표 BPM',s.bpm,'number')}${field('topic','가사 주제 / 이야기',s.topic)}${field('mood','감정 키워드',s.mood)}${field('voice','보컬 특징',s.voice)}${field('instruments','핵심 악기',s.instruments)}</div>${field('hook','후렴 핵심 문장',s.hook)}${field('structure','곡 구조',s.structure)}<div class="actions"><button class="btn primary" id="generateSong">✦ ChatGPT 신곡 실행문 복사</button><button class="btn" id="makeStyle">기본 Style 구성</button><button class="btn" data-copy="style">스타일 복사</button><button class="btn" data-copy="lyrics">가사 복사</button></div></div><div class="panel"><h2 class="sectionTitle">Suno 입력 패키지</h2>${field('style','Style (영어)',s.style,'textarea')}${field('exclude','Exclude',s.exclude,'textarea')}${field('lyrics','최종 가사 (AI 작성 후 직접 수정 가능)',s.lyrics,'textarea','style="min-height:320px"')}${field('qualityNotes','AI 검수 점검사항',s.qualityNotes||'','textarea')}${field('uniqueness','차별화 포인트',s.uniqueness||'','textarea')}${field('songBrief','곡 기술서 / ChatGPT 답변 보관',s.songBrief||'','textarea')}<div class="help">ChatGPT에서 생성한 가사·Style·Exclude·기술서를 이곳에 붙여 넣으세요. API와 서버 연결이 필요하지 않습니다.</div><p><button class="btn" data-copy="brief">곡 기술서 복사</button></p></div>`}
function audio(s){return `<div class="panel"><h2 class="sectionTitle">최종 음원 등록·분석</h2>${field('audioUrl','최종 음원 URL (Suno 또는 파일 공유 링크)',s.audioUrl)}<div class="two">${field('duration','총 길이(초)',s.duration,'number')}${field('audioStatus','음원 검수 상태',s.audioStatus,'select',opts(['미검수','검수중','통과','수정 필요'],s.audioStatus))}</div>${field('sections','곡 구조 / 구간별 타임라인 메모',s.sections,'textarea')}${field('emotionArc','감정 변화 분석',s.emotionArc,'textarea')}<div class="panel" style="background:#1a2639"><h3>음원 파일 검사 (브라우저 내부)</h3><input type="file" id="audioFile" accept="audio/*,.m4a,.mp3,.wav,.ogg,.flac"><p class="help">선택한 파일의 재생 길이를 브라우저가 읽어 기록합니다. 파일은 서버에 전송하거나 자동 저장하지 않습니다. BPM·구조·감정은 분석하지 않으며, 직접 확인 후 입력합니다.</p><div class="actions"><button class="btn primary" id="generateScenesAI">✦ ChatGPT 장면 제작문 복사</button></div><p class="help">ChatGPT 채팅에 최종 음원을 첨부한 뒤 복사한 제작 요청문을 전송하세요. 생성된 장면별 결과는 Grok 탭에 수동 등록하세요.</p></div><button class="btn" data-copy="audioBrief">음원 분석 의뢰문 복사</button></div>`}
function grok(s){let rows=(s.scenes||[]).map((x,i)=>`<div class="scene" data-scene="${i}"><div class="row"><h3>장면 ${i+1}</h3><button class="btn" data-delete-scene="${i}">삭제</button></div><div class="two">${sceneInput(i,'start','시작(초)',x.start,'number')}${sceneInput(i,'end','종료(초)',x.end,'number')}</div>${sceneInput(i,'description','상황·감정·장면 내용',x.description,'textarea')}${sceneInput(i,'imagePrompt','스타트 이미지 프롬프트',x.imagePrompt,'textarea')}${sceneInput(i,'videoPrompt','Grok 영상 모션 프롬프트',x.videoPrompt,'textarea')}<div class="two">${sceneInput(i,'imageUrl','스타트 이미지 링크',x.imageUrl)}${sceneInput(i,'videoUrl','생성 영상 링크',x.videoUrl)}</div><div class="actions"><button class="btn" data-scene-copy="${i}:imagePrompt">이미지 프롬프트 복사</button><button class="btn" data-scene-copy="${i}:videoPrompt">영상 프롬프트 복사</button></div></div>`).join('');return `<div class="panel"><div class="row"><h2 class="sectionTitle">Grok 장면별 제작</h2><button class="btn primary" id="addScene">＋ 장면 추가</button></div><p class="help">장면마다 스타트 이미지와 모션 프롬프트를 별도 관리해. 영상 길이의 합계가 실제 곡 길이를 덮는지 확인하고, Grok 클립 길이에 맞춰 편집에서 조정하세요.</p>${field('character','캐릭터·화풍 고정 설정',s.character,'textarea')}<div class="status">장면 시간 범위: ${coverage(s)} / 음원 ${s.duration||'미등록'}초</div>${rows||'<div class="empty">장면을 추가하거나, 음원 길이 기준으로 장면 뼈대를 생성하세요.</div>'}<div class="actions"><button class="btn" id="addScene">＋ 장면 추가</button><button class="btn" id="autoScenes">12초 임시 구간 나누기 (분석 아님)</button></div></div>`}
function sceneInput(i,key,label,val,type='text'){return `<div class="field"><label>${label}</label>${type==='textarea'?`<textarea data-scene-field="${i}:${key}">${esc(val)}</textarea>`:`<input data-scene-field="${i}:${key}" type="${type}" value="${esc(val)}">`}</div>`}function coverage(s){let q=s.scenes||[];return q.length?`${q.length}개 컷 · ${q.reduce((a,x)=>a+Math.max(0,(+x.end||0)-(+x.start||0)),0).toFixed(1)}초`:'장면 없음'}
function capcut(s){return `<div class="panel"><h2 class="sectionTitle">CapCut 편집 체크리스트</h2><p class="help">아래 항목은 수동 편집 결과를 기록합니다. 자동 CapCut 프로젝트 생성 기능은 아직 없습니다.</p>${checks(s,'editChecks',['Grok 영상 모두 준비','장면 순서와 타임라인 확인','원본 음원 길이와 영상 길이 일치','컷 전환 과장 없음','캐릭터/색감 일관성','자막 없음 또는 의도적 적용','음량·시작/종료 점검','최종 MP4 출력 완료'])}${field('editNotes','편집 메모',s.editNotes,'textarea')}${field('videoUrl','최종 영상 링크',s.videoUrl)}</div>`}
function checks(s,key,items){return items.map((v,i)=>`<label style="display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:12px"><input type="checkbox" style="width:17px;height:17px" data-check="${key}:${i}" ${(s[key]||[])[i]?'checked':''}>${v}</label>`).join('')}
function release(s){return `<div class="panel"><h2 class="sectionTitle">YouTube 업로드 및 출시 게이트</h2>${field('youtubeTitle','유튜브 제목',s.youtubeTitle)}${field('youtubeDescription','설명란',s.youtubeDescription,'textarea')}${field('tags','쉼표 구분 태그',s.tags,'textarea')}${field('youtubeUrl','업로드 URL',s.youtubeUrl)}<h3>최종 출시 체크</h3>${checks(s,'releaseChecks',['가사·발음 검수 완료','최종 Suno 음원 선정','음원 길이·구조 검수','모든 Grok 클립 확인','CapCut 싱크 검수','최종 영상·썸네일 확인','저작권·AI 고지 점검','제목·설명·태그 확인'])}<div class="status">${(s.releaseChecks||[]).filter(Boolean).length===8?'출시 후보 — 실제 업로드는 직접 진행':'출시 보류 — 미확인 항목 존재'}</div></div>`}
function studioPrompt(kind){
 const s=song(); if(!s)return '';
 const history=db.songs.filter(x=>x.id!==s.id).slice(-20).map(x=>`${x.id} | ${x.title||'제목 미정'} | ${x.genre} | ${x.topic||''} | ${x.hook||''}`).join('\n');
 const base=`[AI MUSIC STUDIO v0.4 | ${kind}]
곡 ID: ${s.id}
채널: ${s.channel}
제목: ${s.title||'미정'}
장르: ${s.genre}
주제: ${s.topic||'적절히 선정'}
감정: ${s.mood}
BPM: ${s.bpm}
보컬: ${s.voice}
악기: ${s.instruments}
후렴 문구: ${s.hook||'제안 필요'}
구조: ${s.structure}
이전 곡(사용자 입력 자료이며 완전한 이력 아님):
${history||'자료 없음'}
`;
 if(kind==='신곡 실행')return base+`
위 기록을 참고해 새 오리지널 인디 로파이 여성 보컬곡을 제작해. 최근 곡과 유사한 제목·후렴·주제·편곡을 피하고, 적합한 세부 장르를 고른 다음 후렴을 먼저 설계해. 1) 곡 기술서(제목/서사/감정선/BPM/악기/보컬/구조/차별화) 2) Suno에 그대로 붙일 최종 가사(구조 태그 포함) 3) 짧은 영어 Style 4) Exclude 5) 레드팀 가사 QA 및 수정 결과를 각각 별도 복사 블록으로 출력해. 일본어 채널이면 일본어 가사 원문과 별도 한국어 발음·뜻을 포함해. 최종본과 초안을 섞지 마. 결과는 내 웹앱의 Suno 입력 칸에 수동으로 저장할 거야.`;
 if(kind==='검수')return base+`
현재 가사:
${s.lyrics||'미입력'}
Style: ${s.style||'미입력'}
Exclude: ${s.exclude||'미입력'}
발음·호흡·가사의 자연스러움·후렴·중복·편곡 목표를 엄격히 검수하고 통과/수정/미검수를 근거와 함께 제시해. 음원 미첨부 시 실제 음악을 들었다고 주장하지 마.`;
 if(kind==='장면 제작')return base+`
최종 가사:
${s.lyrics||'미입력'}
총길이(브라우저 확인 또는 사용자 입력): ${s.duration||'미확인'}초
곡 구간 메모: ${s.sections||'미입력'}
감정선: ${s.emotionArc||'미입력'}
캐릭터 기준: ${s.character||'제안 요청'}
최종 Suno 음원 파일을 이 채팅에 별도 첨부하겠다. 실제 확인 가능한 구간만 검증하고, 근거 없는 추측은 미확인으로 표시해. 장면별 시작초·끝초·감정·상황·스타트 이미지용 프롬프트·해당 이미지와 일치하는 Grok 모션 프롬프트·카메라 움직임을 한 장면씩 제안해. 각 컷 최대 길이를 사용자가 정한 Grok 설정과 맞추고, 전체 음원 타임라인에 빈 구간이 없는지 점검해. 이미지에 텍스트 넣지 마.`;
 if(kind==='편집')return base+`
장면 정보:
${(s.scenes||[]).map((x,i)=>`${i+1}번 ${x.start}-${x.end}초, ${x.description||''}, 영상 URL ${x.videoUrl||'없음'}`).join('\n')}
CapCut에서 사용할 컷별 순서와 정확한 사용 길이, 원곡 싱크, 감정 연결, 최소한의 전환, 마무리 점검표를 제공해. 파일이 첨부되지 않은 장면의 영상 품질은 미검수로 표시해.`;
 return base+`
현재 단계 ${s.stage}. 제출된 자료를 근거로 누락된 단계부터 다음 작업을 진행해. 미검수 작업이나 사용자 음원/영상 생성이 필요한 단계에서는 임의로 완료하지 마. 지금 내가 해야 할 행동과 복사 가능한 결과물을 제시해.`;
}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{activeId=b.dataset.open;subtab='suno';save();go('workspace')});document.querySelectorAll('#newSong').forEach(b=>b.onclick=()=>{let s={id:id(),title:'',channel:'한국어 채널',genre:'Acoustic Lo-fi',stage:'기획',bpm:80,topic:'',mood:'따뜻한 그리움',voice:'soft intimate female vocal',instruments:'acoustic guitar, mellow piano',hook:'',structure:'[Intro] [Verse 1] [Chorus] [Verse 2] [Chorus] [Bridge] [Final Chorus] [Outro]',style:'',exclude:'EDM, trap hi-hats, harsh distortion, aggressive rock, overly dramatic belting',lyrics:'',audioUrl:'',duration:'',audioStatus:'미검수',sections:'',emotionArc:'',character:'',scenes:[],editChecks:[],releaseChecks:[],createdAt:new Date().toISOString()};db.songs.push(s);activeId=s.id;subtab='suno';save();go('workspace')});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{subtab=b.dataset.tab;render()});document.querySelectorAll('[data-field]').forEach(e=>{e.oninput=()=>{let s=song();if(!s)return;s[e.dataset.field]=e.value;save()};e.onchange=()=>{if(['title','genre','channel'].includes(e.dataset.field))render()}});document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{let [k,i]=e.dataset.check.split(':');let s=song();if(!s[k])s[k]=[];s[k][+i]=e.checked;save();if(k==='releaseChecks')render()});document.querySelectorAll('[data-scene-field]').forEach(e=>e.oninput=()=>{let [i,k]=e.dataset.sceneField.split(':');song().scenes[+i][k]=e.value;save()});document.querySelectorAll('[data-delete-scene]').forEach(e=>e.onclick=()=>{if(confirm('이 장면을 삭제할까요?')){song().scenes.splice(+e.dataset.deleteScene,1);save();render()}});document.querySelectorAll('[data-scene-copy]').forEach(e=>e.onclick=()=>{let [i,k]=e.dataset.sceneCopy.split(':');copy(song().scenes[+i][k])});document.querySelectorAll('[data-copy]').forEach(e=>e.onclick=()=>{let s=song(),k=e.dataset.copy;let t=k==='brief'?`곡 ID: ${s.id}\n채널: ${s.channel}\n장르: ${s.genre}\n제목: ${s.title}\n주제: ${s.topic}\n감정: ${s.mood}\nBPM: ${s.bpm}\n보컬: ${s.voice}\n악기: ${s.instruments}\n후렴: ${s.hook}\n구조: ${s.structure}`:k==='audioBrief'?`음원: ${s.audioUrl}\n총길이: ${s.duration}초\n곡 구조: ${s.sections}\n감정선: ${s.emotionArc}\n실제 음원을 바탕으로 영상 장면별 타임라인과 캐릭터 앵커, 스타트 이미지 및 Grok 모션 프롬프트를 설계해줘. 추측과 실측을 구분해.`:s[k]||'';copy(t)});let af=document.getElementById('audioFile');if(af)af.onchange=async()=>{const file=af.files?.[0];if(!file)return;const audio=document.createElement('audio'),u=URL.createObjectURL(file);audio.preload='metadata';audio.src=u;try{await new Promise((ok,fail)=>{audio.onloadedmetadata=ok;audio.onerror=()=>fail(Error('이 파일을 브라우저에서 읽을 수 없습니다.'))});let d=audio.duration;if(!Number.isFinite(d)||d<=0)throw Error('재생 길이를 확인할 수 없습니다.');song().duration=Math.round(d*100)/100;song().audioFileName=file.name;save();render();alert('음원 길이 '+d.toFixed(2)+'초 등록 완료. 실제 곡 구조는 별도 검수하세요.')}catch(e){alert(e.message)}finally{URL.revokeObjectURL(u)}};let ag=document.getElementById('generateScenesAI');if(ag)ag.onclick=()=>copy(studioPrompt('장면 제작'));let gs=document.getElementById('generateSong');if(gs)gs.onclick=()=>copy(studioPrompt('신곡 실행'));let ms=document.getElementById('makeStyle');if(ms)ms.onclick=()=>{let s=song();s.style=`${s.channel==='夏のあとで'?'Japanese':'Korean'} ${s.genre.toLowerCase()}, ${specs[s.genre]}, natural ${s.channel==='夏のあとで'?'Japanese':'Korean'} pronunciation, ${s.bpm||80} BPM, ${s.mood||'nostalgic'} mood, restrained emotional chorus, gentle dynamics, natural warm mix`;save();render()};document.querySelectorAll('[data-studio-command]').forEach(b=>b.onclick=()=>copy(studioPrompt(b.dataset.studioCommand)));let ns=document.getElementById('next');if(ns)ns.onclick=()=>{let s=song(),idx=stages.indexOf(s.stage);if(idx===0&&(!s.title||!s.style||!s.lyrics))return alert('곡 제목, Suno 스타일, 최종 가사를 먼저 채워주세요.');if(idx===2&&!s.audioUrl)return alert('최종 음원 링크를 먼저 입력하세요.');if(idx===3&&!s.duration)return alert('실제 음원 길이를 먼저 등록하세요.');if(idx===4&&!s.scenes.length)return alert('영상 장면을 최소 1개 추가하세요.');if(idx===6&&(s.releaseChecks||[]).filter(Boolean).length!==8)return alert('출시 검수 8개 항목을 완료하세요.');s.stage=stages[Math.min(idx+1,stages.length-1)];save();if(idx===1)subtab='audio';if(idx===3)subtab='grok';if(idx===4)subtab='capcut';if(idx===5)subtab='release';render()};let pr=document.getElementById('prev');if(pr)pr.onclick=()=>{let s=song();s.stage=stages[Math.max(0,stages.indexOf(s.stage)-1)];save();render()};let rv=document.getElementById('review');if(rv)rv.onclick=()=>{let s=song();let issue=[];if(!s.title)issue.push('제목 없음');if(!s.lyrics)issue.push('가사 없음');if(!s.style)issue.push('Suno Style 없음');if(stages.indexOf(s.stage)>=3&&!s.duration)issue.push('실제 음원 길이 없음');alert(issue.length?'검수 필요: '+issue.join(', '):'필수 기본 자료 확인됨. 실제 발음·음질·저작권 검수는 별도로 필요합니다.')};let sn=document.getElementById('saveNow');if(sn)sn.onclick=()=>{save();alert('이 브라우저에 저장했습니다.')};document.querySelectorAll('#addScene').forEach(e=>e.onclick=()=>{song().scenes.push({start:'',end:'',description:'',imagePrompt:'',videoPrompt:'',imageUrl:'',videoUrl:''});save();render()});let au=document.getElementById('autoScenes');if(au)au.onclick=()=>{let s=song(),d=+s.duration;if(!(d>0))return alert('음원 길이를 초 단위로 먼저 입력하세요.');if(s.scenes.length&&!confirm('기존 장면을 기본 타임라인으로 대체할까요?'))return;let n=Math.ceil(d/12);s.scenes=Array.from({length:n},(_,i)=>({start:String(i*12),end:String(Math.min(d,(i+1)*12)),description:'장면의 감정과 상황을 작성하세요',imagePrompt:'',videoPrompt:'',imageUrl:'',videoUrl:''}));save();render()};let ex=document.getElementById('export');if(ex)ex.onclick=()=>{let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='ai_music_studio_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};let im=document.getElementById('import');if(im)im.onchange=async()=>{let f=im.files?.[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v.songs))throw Error('형식 오류');if(!confirm('현재 기록을 가져온 백업으로 교체할까요?'))return;db=v;activeId=v.active||null;save();render()}catch(e){alert('백업 파일을 읽을 수 없습니다: '+e.message)}};}
async function copy(t){try{await navigator.clipboard.writeText(t||'');alert('복사했습니다.')}catch(e){let z=document.createElement('textarea');z.value=t;document.body.append(z);z.select();document.execCommand('copy');z.remove();alert('복사했습니다.')}}render();
</script></body></html>
